4px 20px}.nav{border-radius:16px 16px 0 0}}@media(max-width:350px){main{padding:18px 12px}.quick button{padding:14px 10px}.quick strong{font-size:.875rem}.item{padding:14px 12px;gap:9px}.item strong{font-size:.9375rem}.detailbar{flex-wrap:wrap}.intro h2{font-size:1.25rem}}@media(hover:hover){.item:hover,.quick button:hover{background:#faf9fc}.start:hover{background:#fff0a1}}@media print{.nav,.search,.chips,.copy,.pager,.detailbar,.toast{display:none}body,.app{background:white}.app{max-width:none;margin:0;padding:0;box-shadow:none}.steps li{break-inside:avoid}}</style></head><body><div class="app"><header><div class="creator"><span>Created by</span><span>커리어인 대표 박은미 <a href="https://litt.ly/careerin" target="_blank" rel="noopener noreferrer" aria-label="커리어인 사이트 열기 (새 창)">careerins@naver.com</a></span></div><div class="titleline"><h1>환자응대 매뉴얼</h1><span class="badge">직원 교육용</span></div></header><main id="main"></main><nav class="nav" aria-label="주 메뉴"></nav><div id="toast" class="toast hidden" role="status"></div></div><script>const cards=[{"id": "B01", "title": "처음 방문한 환자 맞이하기", "category": "기본 인사·안내", "roles": ["공통", "접수·원무"], "situation": "처음 방문한 환자가 접수대 앞에서 어디로 가야 할지 몰라 주변을 살피고 있습니다.", "steps": ["먼저 인사하고 방문 목적을 묻습니다.", "예약 여부와 필요한 창구를 확인합니다.", "접수 장소와 다음 행동을 안내합니다."], "say": "안녕하세요. 무엇을 도와드릴까요? 진료를 받으러 오셨다면 접수부터 안내해 드리겠습니다.", "avoid": ["인사 없이 기다리게 하기", "여러 요구사항을 한꺼번에 말하기"], "done": "환자가 접수할 곳과 다음 절차를 알고 있습니다."}, {"id": "B02", "title": "다른 업무 중 환자가 말을 걸었을 때", "category": "기본 인사·안내", "roles": ["공통"], "situation": "다른 업무를 처리하는 중에 환자가 “저기요, 좀 물어봐도 될까요?”라고 말을 겁니다.", "steps": ["환자를 알아봤다는 반응을 합니다.", "바로 응대하기 어렵다면 짧게 이유를 알립니다.", "현재 업무를 안전하게 마친 뒤 먼저 응대합니다."], "say": "네, 도와드리겠습니다. 지금 처리 중인 내용을 마무리한 뒤 안내해 드리겠습니다. 잠시 기다려 주시겠어요?", "avoid": ["잠깐만요만 반복하기", "다른 환자의 화면을 노출하기"], "done": "기다리게 한 환자에게 먼저 응대를 재개했습니다."}, {"id": "B03", "title": "처음 접수하는 환자 안내하기", "category": "접수·예약", "roles": ["접수·원무"], "situation": "환자가 “처음 왔는데 접수는 어떻게 하나요?”라고 묻습니다.", "steps": ["예약 여부와 방문 목적을 확인합니다.", "병원의 승인된 본인 확인 절차를 안내합니다.", "필요 항목을 한 단계씩 설명합니다.", "완료 후 대기 장소와 호출 방법을 안내합니다."], "say": "먼저 예약 여부를 확인하겠습니다. 본인 확인과 접수가 끝나면 기다리실 장소와 다음 절차를 안내해 드리겠습니다.", "avoid": ["저기에 적으세요라고만 말하기", "대체 확인 방법을 모르면서 단정하기"], "done": "접수와 대기 안내가 완료됐습니다."}, {"id": "B04", "title": "진료실·검사실 위치 안내하기", "category": "기본 인사·안내", "roles": ["공통"], "situation": "환자가 안내문을 보여 주며 “여기는 어떻게 가나요?”라고 묻습니다.", "steps": ["안내문이나 예약 내역으로 목적지를 확인합니다.", "층과 방향, 표식을 순서대로 안내합니다.", "이동 지원이 필요한지 묻습니다.", "필요하면 담당 직원에게 지원을 요청합니다."], "say": "안내문에 적힌 장소를 확인하고 가시는 길을 안내해 드리겠습니다. 이동하실 때 도움이 필요하신가요?", "avoid": ["방향만 손으로 가리키기", "목적지를 확인하지 않고 보내기", "지원 방법을 모른 채 무리하게 부축하기"], "done": "환자가 이동 방법을 알고 필요한 지원이 연결됐습니다."}, {"id": "B05", "title": "안내를 이해하기 어려워하는 환자 돕기", "category": "기본 인사·안내", "roles": ["공통"], "situation": "환자가 안내를 들은 뒤 “그래서 제가 어디로 가면 되나요?”라고 다시 묻습니다.", "steps": ["속도를 낮추고 쉬운 말을 사용합니다.", "한 번에 한 가지 행동을 안내합니다.", "필요하면 큰 글씨나 위치 표시를 활용합니다.", "다음 행동을 환자의 말로 확인합니다."], "say": "제가 한꺼번에 설명드렸네요. 지금 하실 일부터 차례대로 다시 안내해 드리겠습니다.", "avoid": ["아까 말씀드렸잖아요라고 말하기", "반말하거나 큰소리부터 내기", "동행인에게만 설명하기"], "done": "환자가 다음 행동을 말하거나 수행할 수 있습니다."}, {"id": "B06", "title": "전화로 진료 일정·예약 문의받기", "category": "전화", "roles": ["공통", "접수·원무"], "situation": "전화로 “오늘 진료하나요? 예약도 가능한가요?”라고 묻습니다.", "steps": ["병원과 부서를 밝히고 인사합니다.", "문의 내용을 듣습니다.", "승인된 일정과 예약 정보를 확인합니다.", "날짜·시간·준비사항을 다시 안내합니다."], "say": "안녕하세요. 병원 접수창구입니다. 어느 진료과를 원하시나요? 진료 일정과 예약 가능 여부를 확인해 안내해 드리겠습니다.", "avoid": ["기억만으로 휴진 일정을 안내하기", "불필요한 환자 정보를 요구하기"], "done": "환자가 일정과 예약 방법을 알고 있습니다."}, {"id": "B07", "title": "전화 연결 또는 대기 요청하기", "category": "전화", "roles": ["공통"], "situation": "전화 문의에 답하려면 다른 부서의 확인이 필요합니다.", "steps": ["확인 또는 연결 이유를 알립니다.", "기다릴 수 있는지 묻습니다.", "담당 부서에 문의 요점을 전달합니다.", "연결 실패 시 다시 응대합니다.", "필요하면 승인된 회신 절차를 안내합니다."], "say": "정확한 안내를 위해 담당 부서에 확인하겠습니다. 잠시 기다려 주실 수 있을까요?", "avoid": ["설명 없이 보류하기", "연결 실패 후 그대로 두기", "확인 없이 회신 시간을 약속하기"], "done": "담당자 연결 또는 후속 안내 방법이 정해졌습니다."}, {"id": "B08", "title": "대기 장소·호출 방법 안내하기", "category": "대기·순서", "roles": ["공통", "접수·원무", "간호"], "situation": "접수를 마친 환자가 “이제 어디에서 기다리면 되나요?”라고 묻습니다.", "steps": ["이전 단계 완료 여부를 확인합니다.", "대기 장소와 호출 방식을 설명합니다.", "자리를 비울 때 알릴 곳을 안내합니다.", "상태가 나빠지면 바로 알려 달라고 말합니다."], "say": "기다리실 장소와 호출 방법을 안내해 드리겠습니다. 기다리는 동안 몸 상태가 갑자기 나빠지면 바로 직원에게 말씀해 주세요.", "avoid": ["앉아 계세요라고만 말하기", "금방 들어간다고 약속하기"], "done": "환자가 대기 장소·호출 방식·도움 요청 방법을 알고 있습니다."}, {"id": "B09", "title": "답을 확실히 모르는 질문을 받았을 때", "category": "기본 인사·안내", "roles": ["공통"], "situation": "환자가 준비사항이나 절차를 묻지만 직원이 정확한 답을 알지 못합니다.", "steps": ["추정해 답하지 않습니다.", "질문을 정확히 정리합니다.", "해당 담당자에게 확인합니다.", "확인된 내용을 업무 범위 안에서 안내합니다."], "say": "정확히 확인한 뒤 안내해 드리겠습니다. 문의하신 내용을 담당자에게 전달하겠습니다.", "avoid": ["아마 괜찮을 거예요라고 답하기", "인터넷에서 찾아보라고 넘기기"], "done": "확인된 답 또는 후속 절차가 안내됐습니다."}, {"id": "B10", "title": "잘못 안내한 내용 바로잡기", "category": "기본 인사·안내", "roles": ["공통"], "situation": "환자가 이동하거나 예약을 확인하는 과정에서 직원의 안내가 잘못됐다는 사실을 알게 됩니다.", "steps": ["정확한 정보를 확인합니다.", "잘못 안내한 내용을 명확히 정정합니다.", "불편에 대해 사과합니다.", "업무에 영향이 있으면 담당자에게 보고합니다."], "say": "제가 앞서 잘못 안내해 드렸습니다. 혼선을 드려 죄송합니다. 정확한 내용을 확인해 다시 안내해 드리겠습니다.", "avoid": ["환자가 잘못 들은 것처럼 말하기", "실수를 숨기기"], "done": "환자와 관련 부서에 정정 내용이 전달됐습니다."}, {"id": "B11", "title": "수납 후 남은 절차 안내하기", "category": "비용·서류", "roles": ["접수·원무"], "situation": "수납을 마친 환자가 “이제 집에 가도 되나요?”라고 묻습니다.", "steps": ["결제 완료를 확인합니다.", "처방전·서류·검사·예약 등 남은 절차를 확인합니다.", "확인된 행정 절차를 안내합니다.", "의료적 질문은 담당 의료진에게 연결합니다."], "say": "수납이 완료됐습니다. 받으실 서류나 남은 절차가 있는지 확인해 안내해 드리겠습니다.", "avoid": ["확인 없이 그냥 가라고 말하기", "복용법을 추정해 설명하기"], "done": "필요 자료와 다음 절차를 확인했습니다."}, {"id": "B12", "title": "응대 마무리하기", "category": "기본 인사·안내", "roles": ["공통"], "situation": "안내를 마쳤지만 환자가 이동하지 않고 망설이고 있습니다.", "steps": ["다음 행동을 한 문장으로 정리합니다.", "남은 질문을 확인합니다.", "도움 요청 장소를 알려줍니다.", "상황에 맞게 인사합니다."], "say": "다음에 하실 일을 다시 정리해 드리겠습니다. 더 궁금하시거나 도움이 필요한 부분이 있으신가요?", "avoid": ["환자 반응을 확인하지 않고 돌아서기", "아셨죠라고 끝내기"], "done": "환자가 다음 행동과 문의할 곳을 알고 있습니다."}, {"id": "S01", "title": "예약 없이 방문한 환자 안내하기", "category": "접수·예약", "roles": ["접수·원무"], "situation": "예약하지 않은 환자가 “오늘 진료받을 수 있나요?”라고 묻습니다.", "steps": ["방문 function row(c){return `<button class="item ${['S04','S11','S13'].includes(c.id)?'emergency':''}" data-card="${c.id}"><span class="num">${c.id.slice(1)}</span><span class="grow"><strong>${esc(c.title)}</strong><span class="meta">${esc(c.category)}</span></span><span class="arrow">${icon('next')}</span></button>`}
function results(){const a=filtered();return `<section id="listarea" aria-label="상황 목록"><p class="count" role="status" aria-live="polite">${a.length}개 상황${query?' · 검색 결과':''}</p>${a.length?`<div class="list">${a.map(row).join('')}</div>`:'<div class="empty">검색 결과가 없습니다.<br>짧은 단어로 다시 검색해 주세요.<br><button data-action="reset">전체 보기</button></div>'}</section>`}
function render(){detailId=null;document.querySelectorAll('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});let h='';if(tab==='home'){h=`<section class="intro"><h2>어떤 상황을 도와드릴까요?</h2><p>상황을 선택하고 응대 문장부터 확인하세요.</p></section>`;h+=`<button class="start" data-action="start"><span class="starticon">${icon('book')}</span><span class="grow"><strong>처음이라면 기본 응대부터</strong><small>인사부터 마무리까지 · 12개</small></span><span class="arrow">${icon('next')}</span></button><div class="sectionhead"><h2>상황 찾기</h2></div><div class="quick"><button data-tab="situations">${icon('grid')}<strong>상황별 찾아보기</strong><small>주제별 대응 15개</small></button><button data-tab="jobs">${icon('job')}<strong>내 업무별 보기</strong><small>공통 · 원무 · 간호</small></button></div><div class="sectionhead"><h2>자주 찾는 상황</h2><button class="linkbtn" data-tab="situations">전체 보기</button></div><div class="list">${['S03','S08','S12'].map(x=>row(cards.find(c=>c.id===x))).join('')}</div><div class="sectionhead"><h2>즉시 확인이 필요한 상황</h2></div><div class="list">${['S04','S11','S13'].map(x=>row(cards.find(c=>c.id===x))).join('')}</div><div class="routine"><strong>기본 응대 순서</strong>인사 → 목적 확인 → 안내 → 연결 → 마무리</div><p class="safety">실제 업무는 자격·권한과 병원 지침에 따릅니다. 위험 상황에서는 의료진 호출과 안전 확보를 먼저 합니다.</p>`}else{h=`<section class="intro"><h2>${tab==='basic'?'기본 응대':tab==='situations'?'상황별 찾아보기':'내 업무별 보기'}</h2><p>${tab==='basic'?'12개 상황을 순서대로 읽어보세요.':tab==='situations'?'주제를 선택해 필요한 대응을 찾으세요.':'내 업무와 공통 상황을 함께 확인하세요.'}</p></section>${search()}`;if(tab==='situations')h+=`<div class="chips" aria-label="주제 선택">${['전체',...new Set(cards.filter(c=>c.id[0]==='S').map(c=>c.category))].map(t=>`<button data-topic="${esc(t)}" class="${t===topic?'active':''}" aria-pressed="${t===topic}">${esc(t)}</button>`).join('')}</div>`;if(tab==='jobs')h+=`<div class="chips" aria-label="업무 선택">${['전체','공통','접수·원무','간호'].map(r=>`<button data-role="${r}" class="${r===role?'active':''}" aria-pressed="${r===role}">${r}</button>`).join('')}</div>`;h+=results();if(tab==='jobs')h+='<p class="safety">업무별 분류는 수행 권한을 부여하지 않습니다. 간호 메뉴는 간호사 기준입니다.</p>'}$('#main').innerHTML=h;const searchInput=$('#search');if(searchInput)searchInput.addEventListener('input',e=>{query=e.target.value;$('#listarea').outerHTML=results()})}
function show(id,keep=false){const c=cards.find(x=>x.id===id);if(!c)return;if(!keep){savedScroll=window.scrollY;sequence=filtered().map(c=>c.id);if(!sequence.includes(id))sequence=cards.map(c=>c.id)}detailId=id;const i=sequence.indexOf(id);const sayLabel=id==='S13'?'담당자에게 이렇게 보고해요':id==='S14'?'의료진에게 이렇게 확인해요':'환자에게 이렇게 말해요';$('#main').innerHTML=`<article class="detail"><div class="detailbar"><button class="back" data-action="back">${icon('back')}목록으로</button><span class="detailtype">${c.id[0]==='B'?'기본 응대':'상황 대응'} · ${i+1} / ${sequence.length}</span></div><div class="category">${esc(c.category)}</div><h2 id="detailtitle" tabindex="-1">${esc(c.title)}</h2><div class="scenario"><small>이런 상황이에요</small>${esc(c.situation)}</div><h3>${sayLabel}</h3><div class="bubble">“${esc(c.say)}”</div><h3>이렇게 하세요</h3><ol class="steps">${c.steps.map((s,j)=>`<li><span class="stepnum" aria-hidden="true">${j+1}</span><span>${esc(s)}</span></li>`).join('')}</ol><h3>피해야 할 행동</h3><div class="warn"><ul>${c.avoid.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div><h3>마지막 확인 · 보고</h3><div class="check">${esc(c.done)}</div><div class="pager"><button data-action="prev" ${i===0?'disabled':''}>이전 상황</button><button class="next" data-action="next" ${i===sequence.length-1?'disabled':''}>다음 상황</button></div><p class="safety">확실하지 않은 내용은 담당자에게 확인하세요.</p></article>`;window.scrollTo(0,0);$('#detailtitle').focus({preventScroll:true})}
let timer;function toast(t){clearTimeout(timer);$('#toast').textContent=t;$('#toast').classList.remove('hidden');timer=setTimeout(()=>$('#toast').classList.add('hidden'),2600)}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.tab){tab=b.dataset.tab;query='';topic=role='전체';render();window.scrollTo(0,0)}else if(b.dataset.card)show(b.dataset.card);else if(b.dataset.topic){topic=b.dataset.topic;render();const active=document.querySelector('.chips .active');if(active)active.scrollIntoView({block:'nearest',inline:'nearest'})}else if(b.dataset.role){role=b.dataset.role;render()}else{const a=b.dataset.action;if(a==='clear'){query='';render();$('#search').focus()}else if(a==='reset'){query='';topic=role='전체';render()}else if(a==='start'){tab='basic';query='';render();show('B01')}else if(a==='back'){render();window.scrollTo(0,savedScroll)}else if(a==='next'||a==='prev'){const id=sequence[sequence.indexOf(detailId)+(a==='next'?1:-1)];if(id)show(id,true)}}});$('.nav').innerHTML=[['home','home','홈'],['basic','book','기본 응대'],['situations','grid','상황별'],['jobs','job','내 업무']].map(([id,k,t])=>`<button data-tab="${id}"><span class="navicon">${icon(k)}</span>${t}</button>`).join('');render();</script></body></html>
